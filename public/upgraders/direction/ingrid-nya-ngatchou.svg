<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-label="Ingrid Nya Ngatchou — portrait à venir">
  <!-- Placeholder monogramme — remplacer par la photo portrait officielle (640×800, cadrage 4:5). -->
  <defs>
    <radialGradient id="glow" cx="30%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#e0705f" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#e0705f" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#e0705f" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="640" height="800" fill="#12131c"/>
  <rect width="640" height="800" fill="url(#glow)"/>
  <circle cx="320" cy="360" r="178" fill="none" stroke="#e0705f" stroke-opacity="0.5" stroke-width="1.2"/>
  <circle cx="320" cy="360" r="156" fill="none" stroke="#f4f2ea" stroke-opacity="0.14" stroke-width="1"/>
  <text x="320" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="104" letter-spacing="6" fill="#f4f2ea">I. N.</text>
  <line x1="240" y1="586" x2="400" y2="586" stroke="#f4f2ea" stroke-opacity="0.16" stroke-width="1"/>
  <text x="320" y="640" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="15" letter-spacing="5" fill="#a7a49a">UPGRADERS</text>
  <text x="320" y="668" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" letter-spacing="4" fill="#7d7b72">CO-FONDATRICE</text>
  <circle cx="320" cy="712" r="3" fill="#e0705f"/>
  <rect width="640" height="800" filter="url(#grain)" opacity="0.35" fill="#12131c"/>
</svg>
