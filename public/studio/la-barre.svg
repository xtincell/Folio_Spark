<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">La Barre — schéma de fonctionnement</title><desc id="desc">Un brief guide les propositions. Chaque pièce est versionnée, revue puis livrée. Illustration conceptuelle, pas une capture du logiciel.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f6f2e9" stroke-opacity=".045"/></pattern><linearGradient id="glow" x2="1" y2="1"><stop stop-color="#f26a35" stop-opacity=".16"/><stop offset="1" stop-color="#121212"/></linearGradient></defs>
<rect width="1600" height="1000" fill="#0b0b0b"/><rect width="1600" height="1000" fill="url(#grid)"/>
<g font-family="Arial, sans-serif" fill="#f6f2e9"><text x="100" y="105" font-size="16" letter-spacing="4" fill="#f26a35">XTINCELL × UPGRADERS / SHINKIRO</text><text x="95" y="225" font-size="100" letter-spacing="-6">La Barre.</text><text x="100" y="280" font-size="25" fill="#b6b1a8">Donner une direction. Garder le fil de chaque décision.</text>
<path d="M100 330H1500" stroke="#f6f2e9" stroke-opacity=".2"/>
<rect x="100" y="395" width="300" height="360" rx="4" fill="#141414" stroke="#36332f"/><text x="130" y="445" font-size="14" letter-spacing="2" fill="#f26a35">01 / LE CADRAGE</text><text x="130" y="505" font-size="32">Le brief.</text><text x="130" y="555" font-size="18" fill="#b6b1a8">La marque &amp; son enjeu</text><text x="130" y="590" font-size="18" fill="#b6b1a8">Le public &amp; le message</text><text x="130" y="625" font-size="18" fill="#b6b1a8">Les livrables attendus</text><path d="M130 665H370" stroke="#36332f"/><text x="130" y="710" font-size="15" fill="#b6b1a8">Un cap partagé.</text>
<rect x="475" y="370" width="650" height="410" rx="4" fill="url(#glow)" stroke="#f26a35"/><text x="510" y="420" font-size="14" letter-spacing="2" fill="#f26a35">02 / LE JUGEMENT CRÉATIF</text><text x="510" y="480" font-size="40">La pièce au centre.</text><rect x="510" y="515" width="310" height="195" fill="#221a16" stroke="#734029"/><path d="M550 675 660 550 760 675M620 625H714" stroke="#f26a35" stroke-width="3" fill="none"/><circle cx="770" cy="550" r="13" fill="#f26a35"/><text x="850" y="550" font-size="18">Version</text><text x="850" y="575" font-size="14" fill="#b6b1a8">Une trace à chaque étape</text><text x="850" y="620" font-size="18">Responsable</text><text x="850" y="645" font-size="14" fill="#b6b1a8">Un interlocuteur identifié</text><text x="850" y="690" font-size="18">Décision</text><text x="850" y="715" font-size="14" fill="#b6b1a8">Un retour contextualisé</text>
<rect x="1200" y="395" width="300" height="360" rx="4" fill="#141414" stroke="#36332f"/><text x="1230" y="445" font-size="14" letter-spacing="2" fill="#f26a35">03 / LES ENGAGEMENTS</text><text x="1230" y="505" font-size="32">La suite.</text><text x="1230" y="555" font-size="18" fill="#b6b1a8">Retours à traiter</text><text x="1230" y="590" font-size="18" fill="#b6b1a8">Versions à valider</text><text x="1230" y="625" font-size="18" fill="#b6b1a8">Livraison à suivre</text><path d="M1230 665H1470" stroke="#36332f"/><text x="1230" y="710" font-size="15" fill="#b6b1a8">Du regard à l’action.</text>
<g stroke="#f26a35" stroke-width="2" fill="none"><path d="M411 575H461m-10-10 10 10-10 10M1137 575H1187m-10-10 10 10-10 10"/></g>
<path d="M100 850H1500" stroke="#f6f2e9" stroke-opacity=".2"/><text x="100" y="905" font-size="16" letter-spacing="1" fill="#b6b1a8">SCHÉMA DE FONCTIONNEMENT — ILLUSTRATION CONCEPTUELLE, PAS UNE CAPTURE DU LOGICIEL.</text><text x="1500" y="945" text-anchor="end" font-size="14" fill="#f26a35">BRIEF → PIÈCE → DÉCISION → LIVRAISON</text></g></svg>